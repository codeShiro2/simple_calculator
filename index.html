<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <style>
    body { font-family: Arial, sans-serif; background: #eee; margin: 0; padding: 16px; }
    #calculator { max-width: 360px; margin: 0 auto; background: #ddd; padding: 16px; border-radius: 8px; }
    #display { background: #bbb; padding: 16px; font-size: 1.8rem; text-align: right; margin-bottom: 12px; overflow-x: auto; min-height: 1.5em; }
    #keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    #keys button { padding: 14px 0; font-size: 1.1rem; border: none; background: #ddd; cursor: pointer; }
    #keys button:hover { background: #ccc; }
    #keys .op { color: #3a00ff; }
    #keys .clear { color: red; }
    #keys .equals { background: #0d6efd; color: #fff; }
  </style>
</head>
<body>
  <script src="script.js"></script>
  <script src="https://app.zenclass.in/sheets/v1/js/zen/suite/bundle.js"></script>
</body>
</html>
